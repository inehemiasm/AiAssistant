name: Firebase App Distribution

on:
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: read

concurrency:
  group: firebase-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check localization coverage and format arguments
        run: python3 scripts/check_localization.py

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $GOOGLE_SERVICES_JSON | base64 --decode > app/google-services.json

      - name: Decode Service Account JSON
        env:
          CREDENTIAL_FILE_CONTENT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: echo $CREDENTIAL_FILE_CONTENT | base64 --decode > service-account.json

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo $ENCODED_KEYSTORE | base64 --decode > release.jks

      - name: Validate, Build and Upload Release to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:lintRelease
          ./gradlew :app:assembleRelease :app:bundleRelease
          python3 scripts/check_native_alignment.py app/build/outputs/bundle/release/app-release.aab
          ./gradlew appDistributionUploadRelease
